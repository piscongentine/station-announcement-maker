<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 96" width="600" height="96" role="img" aria-label="Download the latest Station Announcement Maker setup for Windows">
<style>
.halo{animation:halo 2.2s ease-in-out infinite;transform-origin:300px 48px}
@keyframes halo{0%,100%{opacity:.35;transform:scale(.98)}50%{opacity:.85;transform:scale(1.02)}}
.shine{animation:shine 2.8s ease-in-out infinite}
@keyframes shine{0%{transform:translateX(-160px)}60%,100%{transform:translateX(700px)}}
.arrow{animation:bob 1.2s ease-in-out infinite}
@keyframes bob{0%,100%{transform:translateY(-3px)}50%{transform:translateY(3px)}}
.t{font-family:'Segoe UI',Inter,'Helvetica Neue',Arial,sans-serif}
</style>
<defs>
<linearGradient id="g" x1="0" x2="1"><stop offset="0" stop-color="#1D4ED8"/><stop offset=".55" stop-color="#3B82F6"/><stop offset="1" stop-color="#10B981"/></linearGradient>
<linearGradient id="sh" x1="0" x2="1"><stop offset="0" stop-color="#fff" stop-opacity="0"/><stop offset=".5" stop-color="#fff" stop-opacity=".45"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></linearGradient>
<clipPath id="c"><rect x="10" y="10" width="580" height="76" rx="38"/></clipPath>
<filter id="b" x="-20%" y="-50%" width="140%" height="200%"><feGaussianBlur stdDeviation="7"/></filter>
</defs>
<rect class="halo" x="14" y="14" width="572" height="68" rx="34" fill="#3B82F6" filter="url(#b)"/>
<rect x="10" y="10" width="580" height="76" rx="38" fill="url(#g)"/>
<g clip-path="url(#c)"><rect class="shine" x="0" y="0" width="120" height="96" fill="url(#sh)" transform="skewX(-20)"/></g>
<circle cx="56" cy="48" r="24" fill="#0F172A" fill-opacity=".28"/>
<g class="arrow" stroke="#fff" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round" fill="none"><path d="M56 36v20M48 49l8 8 8-8"/><path d="M45 61h22"/></g>
<text class="t" x="94" y="44" font-size="22" font-weight="800" fill="#fff">Download latest Setup for Windows</text>
<text class="t" x="94" y="66" font-size="14" font-weight="600" fill="#DBEAFE">Station-Announcement-Maker-Setup.exe  ·  always the newest version</text>
</svg>